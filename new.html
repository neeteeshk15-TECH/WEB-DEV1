<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM IN JS</title>
</head>
<body class="full">
    <div class="parent">
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>    
        <div class="day">Thursday</div>
        <script>
            const parent=document.querySelector('.parent');
            console.log(parent);
            console.log(parent.children);
            console.log(parent.children[1]);
            console.log(parent.children[1].innerHTML);
            for(i=0;i<parent.children.length;i++){
                console.log(parent.children[i].innerHTML);
                parent.children[i].style.color='palevioletred';

            }
            parent.children[0].style.backgroundColor='blue';
            const newElement=document.querySelector('.full');
            newElement.style.backgroundColor='black';
            console.log(parent.firstElementChild);
            console.log(parent.lastElementChild);
            const dayone=document.querySelector('.day');
            console.log(dayone);
            console.log(dayone.nextElementSibling);
            console.log(dayone.parentElement);
            
            console.log("NODES:", parent.childNodes );
            //here everything is node also div is a node and enter for next node that is also a text node so every things is a node
            
            







        </script>

    </div>
    
</body>
</html>
